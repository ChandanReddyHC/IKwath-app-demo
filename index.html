<script>
(function(){
  var inApp = window.name === "ikwath-app";
  var de = document.documentElement;
  if (inApp) { de.classList.add("ikw-app"); return; }
  var wide = function(){ return window.innerWidth >= 600; };
  var mode = wide();
  if (mode) {
    window.__IKW_OUTER__ = true;               // the bundle will not mount React in this page
    de.classList.add("ikw-desktop");
    var stage = document.createElement("div");
    stage.className = "ikw-stage";
    stage.innerHTML =
      '<div class="ikw-side"><b>iKwath</b><p>Fresh kwatha, brewed on demand. This is the mobile app, shown at phone size on larger screens.</p><span class="tag">Mobile app view</span></div>' +
      '<div class="ikw-phone"><iframe title="iKwath app" name="ikwath-app" allow="geolocation; clipboard-write; camera"></iframe></div>';
    document.body.appendChild(stage);
    stage.querySelector("iframe").src = location.href;
  } else {
    de.classList.add("ikw-app");
  }
  var t;
  window.addEventListener("resize", function(){ clearTimeout(t); t = setTimeout(function(){ if (wide() !== mode) location.reload(); }, 250); });
})();
